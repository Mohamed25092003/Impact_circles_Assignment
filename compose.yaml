services:
  api:
    build: .
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://impact:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/impact_circle
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: impact_circle
      POSTGRES_USER: impact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impact -d impact_circle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
